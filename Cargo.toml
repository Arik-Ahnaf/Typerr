[package]
name = "typerr"
version = "2.1.0"
edition = "2024"

[dependencies]
iced = { version = "=0.14.0", features = ["advanced", "svg", "canvas", "image-without-codecs"] }
rand = "=0.10.3"
serde_json = "1.0"
rusqlite = { version = "=0.41.1", features = ["bundled"] }

ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "gzip"] }
semver = "1.0"
sha2 = "0.10"
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
tempfile = "=3.27.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "=0.17.2"

[build-dependencies]
serde_json = "1.0"

# Keep interactive image loading fast in `cargo run`, too. Application code
# retains its normal debug settings; only the pixel processing is optimized.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.iced_tiny_skia]
opt-level = 2
